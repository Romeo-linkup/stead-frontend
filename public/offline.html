<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline - Stead Lynk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
	--bg: #F6F4EE;
	--ink: #1C2321;
	--tile: #1C2321;
	--line: #A8823A;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #141917;
		--ink: #F1EEE6;
		--tile: #F1EEE6;
		--line: #1C2321;
	}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
	font-family: 'Public Sans', -apple-system, sans-serif;
	background: var(--bg);
	color: var(--ink);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 20px;
}
.container {
	text-align: center;
	max-width: 340px;
}
.logo {
	width: 80px;
	height: 80px;
	margin: 0 auto 24px;
}
h1 {
	font-family: 'Newsreader', Georgia, serif;
	font-size: 28px;
	font-weight: 600;
	margin-bottom: 12px;
}
p {
	font-size: 14px;
	line-height: 1.5;
	color: var(--ink);
	opacity: 0.8;
	margin-bottom: 24px;
}
.btn {
	display: inline-block;
	padding: 12px 24px;
	background: var(--line);
	color: #fff;
	border: none;
	border-radius: 4px;
	font-family: inherit;
	font-size: 14px;
	font-weight: 600;
	cursor: pointer;
	text-decoration: none;
}
.btn:hover { opacity: 0.9; }
@media (pointer: coarse) {
	.btn { min-height: 44px; }
}
</style>
</head>
<body>
<div class="container">
	<svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
		<rect width="120" height="120" rx="27" fill="var(--tile)"/>
		<rect x="5" y="5" width="110" height="110" rx="22" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-opacity=".28"/>
		<path d="M90 52 L60 26 L30 52 V70 H90 V94 H30" fill="none" stroke="var(--line)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
		<circle cx="60" cy="53" r="5.5" fill="var(--line)"/>
	</svg>
	<h1>You're offline</h1>
	<p>Stead Lynk needs an internet connection to load your information. Check your connection and try again.</p>
	<button class="btn" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
